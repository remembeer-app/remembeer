name: Convex PR Base

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  retarget:
    name: Retarget to convex
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'convex-') &&
      github.event.pull_request.base.ref != 'convex'
    runs-on: ubuntu-latest

    steps:
      - name: Change pull request base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --method PATCH
          "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          --field base=convex
