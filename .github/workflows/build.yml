name: Check and Build

on:
  push:
    branches:
      - main
      - convex
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

jobs:
  checks:
    name: Format Check & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check build_runner generated files are up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if [ -n "$(git status --porcelain -- . ':!pubspec.lock')" ]; then
            echo "::error::build_runner generated files are out of date. Please run 'dart run build_runner build' and commit the changes."
            git status
            git diff
            exit 1
          fi

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Create .env.client file
        run: |
          echo "CONVEX_SITE_URL=${{ secrets.CONVEX_SITE_URL }}" >> .env.client
          echo "CONVEX_URL=${{ secrets.CONVEX_URL }}" >> .env.client

      - name: Analyze
        run: flutter analyze --fatal-warnings

  typescript_checks:
    name: TypeScript Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck Convex
        run: npm run convex:typecheck

  convex_generated:
    name: Convex Generated Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          npm ci
          flutter pub get

      - name: Start local Convex backend
        run: |
          cp .env.example .env
          docker compose up -d --wait backend
          echo 'CONVEX_SELF_HOSTED_URL=http://127.0.0.1:3210' >> "$GITHUB_ENV"
          admin_key="$(docker compose exec -T backend ./generate_admin_key.sh)"
          echo "::add-mask::$admin_key"
          echo "CONVEX_SELF_HOSTED_ADMIN_KEY=$admin_key" >> "$GITHUB_ENV"

      - name: Check Convex generated files are up to date
        run: |
          npx convex dev --once --typecheck enable
          npm run dartvex:codegen
          dart format lib/convex_api
          if [ -n "$(git status --porcelain -- convex/_generated lib/convex_api)" ]; then
            echo "::error::Convex generated files are out of date. Run 'npx convex dev --once' followed by 'npm run convex:generate' and commit the changes."
            git status --short -- convex/_generated lib/convex_api
            exit 1
          fi

      - name: Stop local Convex backend
        if: always()
        run: docker compose down -v

  android_build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env.client file
        run: |
          echo "CONVEX_SITE_URL=${{ secrets.CONVEX_SITE_URL }}" >> .env.client
          echo "CONVEX_URL=${{ secrets.CONVEX_URL }}" >> .env.client

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build Android (apk)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: "Android APK"
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios_build:
    name: Build iOS
    runs-on: macos-latest
    needs: checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env.client file
        run: |
          echo "CONVEX_SITE_URL=${{ secrets.CONVEX_SITE_URL }}" >> .env.client
          echo "CONVEX_URL=${{ secrets.CONVEX_URL }}" >> .env.client

      - name: Build iOS
        run: flutter build ios --release --no-codesign

  ready-to-merge:
    name: Ready to merge
    runs-on: ubuntu-latest
    if: always()
    needs:
      - checks
      - convex_generated
      - typescript_checks
      - android_build
      - ios_build
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: ${{ toJSON(needs) }}
          jobs: ${{ toJSON(needs) }}
