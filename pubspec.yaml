name: remembeer
description: "Track drinks, sessions, and parties with friends."
publish_to: "none"

version: 1.0.0+3

environment:
  sdk: ^3.10.0

dependencies:
  cached_network_image: ^4.0.4
  dartvex:
    git:
      url: https://github.com/ohtenkay/dartvex.git
      ref: main
      path: packages/dartvex
  dartvex_auth_better:
    git:
      url: https://github.com/ohtenkay/dartvex.git
      ref: main
      path: packages/dartvex_auth_better
  dartvex_flutter:
    git:
      url: https://github.com/ohtenkay/dartvex.git
      ref: main
      path: packages/dartvex_flutter

  diacritic: ^0.1.6
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_map: ^8.3.1
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  gap: ^3.0.1
  geolocator: ^14.1.1
  get_it: ^9.3.0
  go_router: ^18.0.2
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  persistent_bottom_nav_bar_v2: ^6.4.0
  toastification: ^3.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.16.2
  dartvex_codegen:
    git:
      url: https://github.com/ohtenkay/dartvex.git
      ref: main
      path: packages/dartvex_codegen
  flutter_lints: ^6.0.0
  go_router_builder: ^4.4.0

dependency_overrides:
  # TODO(ohtenkay): Remove when geolocator_linux supports dbus 0.8.
  connectivity_plus: 7.3.1
  dartvex:
    git:
      url: https://github.com/ohtenkay/dartvex.git
      ref: main
      path: packages/dartvex

flutter:
  assets:
    - .env.client
    - assets/avatars/
    - assets/badges/
    - assets/icons/

  uses-material-design: true
